<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Domain | Blue Stars Usa</title>
  <style>
    * { box-sizing:border-box; }
    body { margin:0; background:#fffdfa; color:#201a1f; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; line-height:1.5; }
    main { min-height:100svh; display:grid; place-items:center; padding:28px; }
    .panel { width:min(100%,900px); background:#fff; border:1px solid #e7dfe5; border-radius:8px; overflow:hidden; box-shadow:0 22px 60px rgba(35,47,52,.14); }
    .preview { display:block; width:100%; height:auto; border:0; }
    .copy { padding:clamp(24px,5vw,44px); }
    .eyebrow { color:#675c64; text-transform:uppercase; font-size:13px; font-weight:950; letter-spacing:.08em; }
    h1 { margin:12px 0 12px; font-size:clamp(36px,6vw,66px); line-height:1; letter-spacing:0; }
    h2 { margin:22px 0 10px; font-size:28px; line-height:1.1; }
    p { color:#675c64; font-size:18px; margin:0 0 16px; }
    .price,.callout { margin:22px 0; padding:18px; border-radius:8px; background:#f2fbfa; border-left:5px solid #2d6f73; color:#201a1f; font-size:20px; font-weight:900; }
    .steps { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin:22px 0; }
    .step,.field { border:1px solid #e7dfe5; border-radius:8px; padding:16px; background:#fff; }
    .step strong,.field label { display:block; color:#201a1f; font-weight:950; margin-bottom:6px; }
    .actions { display:flex; flex-wrap:wrap; gap:12px; margin-top:24px; }
    a,button { min-height:46px; border-radius:8px; padding:13px 18px; display:inline-flex; align-items:center; justify-content:center; text-decoration:none; font-weight:900; border:0; cursor:pointer; font:inherit; }
    .primary { background:#2d6f73; color:#fff; }
    .secondary { border:1px solid #e7dfe5; color:#201a1f; background:#fff; }
    .disabled { background:#b8b8b8; color:#fff; cursor:not-allowed; }
    input,textarea,select { width:100%; min-height:44px; border:1px solid #e7dfe5; border-radius:8px; padding:10px 12px; font:inherit; }
    textarea { min-height:92px; }
    .formgrid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .note { margin-top:22px; font-size:14px; color:#675c64; }
    @media (max-width:760px) { .steps,.formgrid { grid-template-columns:1fr; } }
  </style>
</head>
<body><main><section class="panel">
      <div class="copy">
        <div class="eyebrow">Address for the front door</div>
        <h1>Choose where the site should live.</h1>
        <p>If you already have a domain, use it. If not, choose one of these and we will confirm availability before purchase.</p>
        <form id="domainForm" method="post" action="https://formsubmit.co/preview@findablewebdesign.com">
          
          <input type="hidden" name="_next" value="https://findablewebdesign.com/campaign-v1/blue-stars-usa/thank-you.html">
          <input type="hidden" name="_subject" value="Findable domain choice - Blue Stars Usa">
          <input type="hidden" name="_template" value="table">
          <input type="hidden" name="_captcha" value="false">
          <input type="hidden" name="prospect_slug" value="blue-stars-usa">
          <input type="hidden" name="business" value="Blue Stars Usa">
          <input type="hidden" name="preview_url" value="https://findablewebdesign.com/campaign-v1/blue-stars-usa/">
          <div class="steps"><label class="step"><input type="radio" name="domain" value="bluestarsusa.com"> <strong>bluestarsusa.com</strong> Check and reserve after launch payment.</label><label class="step"><input type="radio" name="domain" value="bluestarsusabooking.com"> <strong>bluestarsusabooking.com</strong> Check and reserve after launch payment.</label><label class="step"><input type="radio" name="domain" value="bookbluestarsusa.com"> <strong>bookbluestarsusa.com</strong> Check and reserve after launch payment.</label></div>
          <div class="field"><label>Existing domain or different idea</label><input name="custom" placeholder="example.com or your preferred idea"></div>
          <div class="callout">Domain cost is separate and billed at cost after launch approval.</div>
          <div class="actions"><button class="primary" type="submit">Send Domain Choice</button></div>
        </form>
      </div>
      
    </section></main></body></html>
